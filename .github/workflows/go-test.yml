name: Go Tests

on:
  push:
    paths:
      - "spacemosquito/**"
      - ".github/workflows/go-test.yml"
  pull_request:
    paths:
      - "spacemosquito/**"
      - ".github/workflows/go-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacemosquito

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: spacemosquito/go.mod
          cache-dependency-path: spacemosquito/go.sum

      - name: Run unit tests
        run: go test -race ./...

      - name: Run govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
