name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacemosquito
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spacemosquito/go.mod
          cache-dependency-path: spacemosquito/go.sum
      - name: Run unit tests
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    defaults:
      run:
        working-directory: spacemosquito
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spacemosquito/go.mod
          cache-dependency-path: spacemosquito/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="spacemosquito-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            name="${name}.exe"
          fi
          CGO_ENABLED=0 go build \
            -ldflags "-s -w -X github.com/vkh/spacemosquito/internal/cliapp.Version=${VERSION}" \
            -o "../dist/${name}" \
            ./cmd/spacemosquito

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spacemosquito-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/spacemosquito-*

  build-extensions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firefox-extension/package-lock.json
            chrome-extension/package-lock.json

      - name: npm audit (warn-only)
        continue-on-error: true
        run: |
          (cd chrome-extension && npm ci && npm audit --audit-level=high)
          (cd firefox-extension && npm ci && npm audit --audit-level=high)

      - name: Build extension packages
        timeout-minutes: 30
        env:
          VERSION: ${{ github.ref_name }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          REQUIRE_FIREFOX_XPI: "1"
        run: |
          chmod +x scripts/build-extension-zips.sh
          ./scripts/build-extension-zips.sh "$VERSION" dist

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spacemosquito-extensions
          path: |
            dist/spacemosquito-firefox-*.xpi
            dist/spacemosquito-chrome-*.zip

  release:
    needs: [build, build-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum spacemosquito-* > SHA256SUMS || shasum -a 256 spacemosquito-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/spacemosquito-*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
