name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacemosquito
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spacemosquito/go.mod
          cache-dependency-path: spacemosquito/go.sum
      - name: Run unit tests
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    defaults:
      run:
        working-directory: spacemosquito
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spacemosquito/go.mod
          cache-dependency-path: spacemosquito/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="spacemosquito-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            name="${name}.exe"
          fi
          CGO_ENABLED=0 go build \
            -ldflags "-s -w -X github.com/vkh/spacemosquito/internal/cliapp.Version=${VERSION}" \
            -o "../dist/${name}" \
            ./cmd/spacemosquito

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spacemosquito-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/spacemosquito-*

  build-extensions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # previous tag, for the change check

      # Signing the Firefox XPI on AMO is rate-limited, and the extensions
      # rarely change: when nothing but version numbers changed since the
      # previous tag, reuse that release's packages (renamed to this version).
      - name: Check for extension changes
        id: ext
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          changed=true
          if [ -n "$prev" ]; then
            changes=$(git diff "$prev" HEAD -- firefox-extension chrome-extension scripts/build-extension-zips.sh \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '"version":' || true)
            [ -z "$changes" ] && changed=false
          fi
          echo "Previous tag: ${prev:-none}; extensions changed: $changed"
          { echo "prev=$prev"; echo "changed=$changed"; } >> "$GITHUB_OUTPUT"

      - name: Reuse previous extension packages
        id: reuse
        if: steps.ext.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.ext.outputs.prev }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p prev dist
          if gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --dir prev \
               --pattern 'spacemosquito-firefox-*.xpi' --pattern 'spacemosquito-chrome-*.zip' \
             && [ "$(ls prev/spacemosquito-firefox-*.xpi | wc -l)" -eq 1 ] \
             && [ "$(ls prev/spacemosquito-chrome-*.zip | wc -l)" -eq 1 ]; then
            cp prev/spacemosquito-firefox-*.xpi "dist/spacemosquito-firefox-${VERSION}.xpi"
            cp prev/spacemosquito-chrome-*.zip "dist/spacemosquito-chrome-${VERSION}.zip"
            echo "Reused extension packages from $PREV"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "No extension packages in $PREV; building them"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.reuse.outputs.reused != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firefox-extension/package-lock.json
            chrome-extension/package-lock.json

      - name: npm audit (warn-only)
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        run: |
          (cd chrome-extension && npm ci && npm audit --audit-level=high)
          (cd firefox-extension && npm ci && npm audit --audit-level=high)

      - name: Build extension packages
        if: steps.reuse.outputs.reused != 'true'
        timeout-minutes: 30
        env:
          VERSION: ${{ github.ref_name }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          REQUIRE_FIREFOX_XPI: "1"
        run: |
          chmod +x scripts/build-extension-zips.sh
          ./scripts/build-extension-zips.sh "$VERSION" dist

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spacemosquito-extensions
          path: |
            dist/spacemosquito-firefox-*.xpi
            dist/spacemosquito-chrome-*.zip

  release:
    needs: [build, build-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum spacemosquito-* > SHA256SUMS || shasum -a 256 spacemosquito-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/spacemosquito-*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    # Pre-release tags (v1.2.3-rc1) do not update the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist

      - uses: actions/checkout@v7
        with:
          repository: infomosquitos/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        run: |
          mkdir -p homebrew-tap/Casks
          ./scripts/render-homebrew-cask.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > homebrew-tap/Casks/spacemosquito.rb
          cd homebrew-tap
          git add Casks/spacemosquito.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "spacemosquito ${GITHUB_REF_NAME#v}"
          git push
