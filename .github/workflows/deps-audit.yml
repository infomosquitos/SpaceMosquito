name: Dependency audit

# Warn-only vulnerability scans (do not fail the job). See dev/README.md.

on:
  push:
    paths:
      - "spacemosquito/go.mod"
      - "spacemosquito/go.sum"
      - "spacemosquito/**/*.go"
      - "chrome-extension/package.json"
      - "chrome-extension/package-lock.json"
      - "firefox-extension/package.json"
      - "firefox-extension/package-lock.json"
      - ".github/workflows/deps-audit.yml"
  pull_request:
    paths:
      - "spacemosquito/go.mod"
      - "spacemosquito/go.sum"
      - "spacemosquito/**/*.go"
      - "chrome-extension/package.json"
      - "chrome-extension/package-lock.json"
      - "firefox-extension/package.json"
      - "firefox-extension/package-lock.json"
      - ".github/workflows/deps-audit.yml"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacemosquito
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spacemosquito/go.mod
          cache-dependency-path: spacemosquito/go.sum
      - name: Run govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [chrome-extension, firefox-extension]
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high
