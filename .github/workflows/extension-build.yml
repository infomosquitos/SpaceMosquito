name: Extension Build

on:
  push:
    paths:
      - "chrome-extension/**"
      - "firefox-extension/**"
      - ".github/workflows/extension-build.yml"
  pull_request:
    paths:
      - "chrome-extension/**"
      - "firefox-extension/**"
      - ".github/workflows/extension-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [chrome-extension, firefox-extension]
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
