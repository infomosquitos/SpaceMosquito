<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Mosquito</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <img class="mosquito-icon" src="assets/icon.svg" width="24" height="24" alt="">
        <span class="title">Space Mosquito</span>
      </div>
      <button type="button" id="session-chip" class="session-chip" title="Session is invalid or missing">
        <span id="session-dot" class="status-dot checking"></span>
        <span class="session-chip-label">Session</span>
      </button>
    </header>

    <div id="backend-banner" class="backend-banner hidden" role="status" aria-live="polite">
      <strong>Backend unreachable</strong>
      <span id="backend-banner-url"></span>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="page">Page</button>
      <button class="tab-btn" data-tab="spaces">Spaces</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>

    <!-- Page Tab -->
    <div class="tab-content active" id="tab-page">
      <p class="page-host" id="page-host">—</p>
      <h2 class="page-title" id="page-title">Not on a Confluence page</h2>
      <div class="page-meta-row">
        <span class="page-meta" id="page-meta">—</span>
        <span class="page-engine hidden" id="page-engine"></span>
        <button type="button" id="btn-refresh-page" class="btn-sync" title="Refresh this page" disabled aria-label="Refresh page">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3.1L6.7 16.5A7.97 7.97 0 0 0 12 20c4.42 0 8-3.58 8-8 0-2.21-.9-4.21-2.35-5.65z"/>
          </svg>
        </button>
      </div>
      <p class="page-hint hidden" id="page-session-hint">
        Session is invalid or missing
        <button type="button" id="btn-refresh-session" class="btn-hint-action">Refresh</button>
      </p>
    </div>

    <!-- Spaces Tab -->
    <div class="tab-content" id="tab-spaces">
      <div id="spaces-list" class="spaces-compact"></div>

      <div class="spaces-footer">
        <div class="input-group">
          <input type="text" id="add-space-url" class="input" placeholder="Add space URL…">
          <button id="btn-add-space" class="btn btn-small">Add</button>
        </div>
        <button id="btn-crawl-all" class="btn btn-primary btn-full hidden">Crawl all spaces</button>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-content" id="tab-settings">
      <div class="settings-group">
        <h3>Backend</h3>
        <div class="input-group">
          <input type="text" id="backend-url" class="input" placeholder="http://localhost:56403">
          <button id="btn-save-url" class="btn btn-small">Save</button>
        </div>
      </div>

      <div class="settings-group">
        <h3>Session</h3>
        <label class="checkbox-row">
          <input type="checkbox" id="auto-renew">
          <span>Auto-renew session</span>
        </label>
      </div>

      <div class="settings-group">
        <h3>About</h3>
        <p class="version-text">Space Mosquito</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
